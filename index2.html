<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORI WORLD</title>
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#242F3F;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --line:#DDE3E1;
    --text:#23282D;
    --muted:#8B95A1;
    --moss:#5C8374;
    --moss-dark:#456357;
    --amber:#D9A441;
    --danger:#C0564B;
    --duck:#4C9A6A;
    --rabbit:#2B2E33;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 캐릭터 선택 화면 ---------- */
  #charScreen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(92,131,116,0.20), transparent 60%),
      var(--ink);
    flex-direction:column;
  }
  .brand{
    color:#F4F6F5;font-size:13px;letter-spacing:4px;font-weight:700;margin-bottom:26px;opacity:.8;
  }
  .charWrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px;}
  .charCard{
    width:150px;
    background:var(--ink-2);
    border:1.5px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:26px 16px 20px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
  }
  .charCard:hover{border-color:var(--accent,var(--moss));transform:translateY(-2px);}
  .charCard .iconWrap{display:flex;justify-content:center;margin-bottom:12px;}
  .charCard .cname{color:#F4F6F5;font-size:14.5px;font-weight:700;}
  .charCard .cstate{color:#9AA6AE;font-size:11px;margin-top:5px;}

  /* ---------- 비밀번호 설정/입력 화면 ---------- */
  #authScreen{
    height:100vh;display:none;align-items:center;justify-content:center;
    background:var(--ink);
  }
  .authCard{
    width:340px;
    max-width:88vw;
    background:var(--ink-2);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:30px 28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .authBack{
    color:#8FA0A8;font-size:12px;cursor:pointer;margin-bottom:14px;display:inline-block;
  }
  .authBack:hover{color:#fff;}
  .authIdent{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .authIdent .name{color:#F4F6F5;font-size:16px;font-weight:700;}
  .authCard p{color:#9AA6AE;font-size:12.5px;margin:0 0 16px;line-height:1.6;}
  .authCard input{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05);
    color:#F4F6F5;
    font-size:14.5px;
    letter-spacing:2px;
    outline:none;
    margin-bottom:9px;
  }
  .authCard input:focus{border-color:var(--moss);}
  .authCard button{
    width:100%;
    margin-top:6px;
    padding:12px;
    border:none;
    border-radius:9px;
    background:var(--moss);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .authCard button:hover{background:var(--moss-dark);}
  #authError{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- 메인 앱 ---------- */
  #app{display:none;height:100vh;flex-direction:column;}
  header{
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .roomTitle{display:flex;align-items:center;gap:10px;}
  .roomTitle .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 3px rgba(92,131,116,0.25);}
  .roomTitle h1{font-size:15px;margin:0;font-weight:700;letter-spacing:1px;}
  .roomTitle span{font-size:11.5px;color:#9AA6AE;display:block;margin-top:2px;}
  .statusTag{display:inline-block !important;margin-top:0 !important;margin-left:4px;}
  .sysMsg{
    text-align:center;font-size:11px;color:var(--muted);margin:10px 0;
  }
  #meLabel{
    font-size:12.5px;color:#C6D0CB;background:rgba(255,255,255,0.08);
    padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;
  }
  #logoutBtn{
    font-size:11.5px;color:#C6D0CB;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;cursor:pointer;
    margin-left:8px;flex-shrink:0;
  }
  #logoutBtn:hover{background:rgba(255,255,255,0.16);}

  #layout{flex:1;display:flex;overflow:hidden;}

  /* 채팅 영역 */
  #chatPane{
    flex:1 1 62%;
    display:flex;flex-direction:column;
    background:var(--paper);
    border-right:1px solid var(--line);
    min-width:0;
  }
  #messages{
    flex:1;overflow-y:auto;padding:22px 22px 10px;
    display:flex;flex-direction:column;gap:4px;
  }
  .msgRow{display:flex;flex-direction:column;max-width:68%;}
  .msgRow.me{align-self:flex-end;align-items:flex-end;}
  .msgRow.other{align-self:flex-start;align-items:flex-start;}
  .bubble{
    padding:10px 14px;border-radius:14px;font-size:12.5px;line-height:1.5;
    word-break:break-word;white-space:pre-wrap;
  }
  .msgRow.me .bubble{background:var(--moss);color:#fff;border-bottom-right-radius:4px;}
  .msgRow.other .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msgRow.me .bubble a{color:#fff;text-decoration:underline;word-break:break-all;}
  .msgRow.other .bubble a{color:var(--moss-dark);text-decoration:underline;word-break:break-all;}
  .metaRow{font-size:10.5px;color:var(--muted);margin-top:3px;padding:0 3px;display:flex;gap:6px;align-items:center;}
  .metaRow .readTag{color:var(--moss-dark);font-weight:600;}
  .metaRow .actionBtn{cursor:pointer;text-decoration:underline;}
  .senderTag{font-size:11px;color:var(--muted);margin:12px 0 3px 3px;display:flex;align-items:center;gap:5px;}
  .quoteBlock{
    font-size:11px;color:var(--muted);background:rgba(0,0,0,0.05);
    border-left:3px solid var(--moss);padding:4px 8px;border-radius:6px;
    margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .quoteBlock b{color:var(--moss-dark);}

  #replyPreview{
    display:none;align-items:center;justify-content:space-between;
    background:var(--paper);border-top:1px solid var(--line);
    padding:8px 16px;flex-shrink:0;
  }
  #replyPreview.show{display:flex;}
  #replyPreview .rpText{
    font-size:12px;color:var(--text);border-left:3px solid var(--moss);
    padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:85%;
  }
  #replyPreview .rpWho{font-weight:700;color:var(--moss-dark);}
  #rpCancel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;}

  #attachPreview{
    display:none;align-items:center;gap:10px;
    background:var(--paper);border-top:1px solid var(--line);
    padding:8px 16px;flex-shrink:0;
  }
  #attachPreview.show{display:flex;}
  #attachPreview .apThumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0;}
  #attachPreview .apIcon{font-size:20px;flex-shrink:0;}
  #attachPreview .apName{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  #attachPreview #apCancel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;}

  #composer{
    border-top:1px solid var(--line);
    background:#fff;
    padding:12px 16px;
    display:flex;align-items:flex-end;gap:8px;
    position:relative;
    flex-shrink:0;
  }
  #emojiBtn, #photoBtn{
    width:38px;height:38px;flex-shrink:0;border-radius:9px;border:1px solid var(--line);
    background:var(--paper);font-size:18px;cursor:pointer;
  }
  #emojiBtn:hover, #photoBtn:hover{background:#E4EAE8;}
  #photoBtn:disabled{opacity:.5;cursor:default;}
  .imgThumbWrap{
    position:relative;width:180px;height:180px;border-radius:10px;overflow:hidden;cursor:zoom-in;
  }
  .imgThumbWrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .zoomBadge{
    position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.55);color:#fff;
    font-size:11px;padding:3px 7px;border-radius:8px;pointer-events:none;
  }
  .bubble.imgLoading{
    width:150px;height:100px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;color:var(--muted);
  }
  .msgRow.other .bubble.imgLoading, .msgRow.me .bubble.imgLoading{background:var(--paper);color:var(--muted);border:1px dashed var(--line);}
  .bubble.fileCard{
    display:flex;align-items:center;gap:10px;cursor:pointer;min-width:180px;
  }
  .fileIcon{font-size:22px;flex-shrink:0;}
  .fileInfo{overflow:hidden;}
  .fileName{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}
  .fileSize{font-size:10.5px;opacity:.8;margin-top:2px;}
  #imgViewer{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:999;
    align-items:center;justify-content:center;cursor:zoom-out;
  }
  #imgViewer img{max-width:92vw;max-height:92vh;border-radius:6px;}
  #msgInput{
    flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:12.5px;font-family:var(--font);max-height:120px;outline:none;
  }
  #msgInput:focus{border-color:var(--moss);}
  #sendBtn{
    background:var(--moss);color:#fff;border:none;border-radius:10px;
    padding:0 18px;height:40px;font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  #sendBtn:hover{background:var(--moss-dark);}
  #emojiPanel{
    position:absolute;bottom:60px;left:16px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 30px rgba(27,36,48,0.15);
    padding:10px;display:none;
    grid-template-columns:repeat(8,1fr);gap:2px;width:280px;
  }
  #emojiPanel span{
    font-size:19px;text-align:center;padding:6px 0;border-radius:6px;cursor:pointer;
  }
  #emojiPanel span:hover{background:var(--paper);}

  /* 캘린더 영역 */
  #calPane{
    flex:0 0 340px;
    background:#fff;
    overflow-y:auto;
    padding:20px;
  }
  .paneTabs{display:flex;gap:6px;margin-bottom:16px;}
  .paneTab{
    flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
    font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font);
  }
  .paneTab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .paneTab{position:relative;}
  .paneTab.dot::after{content:"";position:absolute;top:5px;right:8px;width:8px;height:8px;border-radius:50%;background:#e5484d;}

  /* 초성퀴즈 */
  #scoreBoard{display:flex;gap:8px;margin-bottom:14px;}
  .scoreCell{
    flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;
    background:var(--paper);border:1.5px solid transparent;font-size:12px;
  }
  .scoreCell.me{border-color:var(--moss);}
  .scoreCell .sc{margin-left:auto;font-weight:800;font-size:15px;color:var(--moss-dark);}
  .quizEmpty{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;padding:26px 8px;background:var(--paper);border-radius:12px;}
  .quizMeta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px;}
  .quizCat{background:#E6F0EC;color:var(--moss-dark);padding:3px 9px;border-radius:12px;font-weight:700;}
  .quizInitials{
    text-align:center;font-size:34px;font-weight:800;letter-spacing:6px;color:var(--ink);
    background:var(--paper);border-radius:14px;padding:22px 8px;margin-bottom:8px;word-break:keep-all;
  }
  .quizHintLine{text-align:center;font-size:13px;letter-spacing:4px;color:var(--moss-dark);min-height:18px;margin-bottom:6px;font-weight:700;}
  .quizSetterNote{text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px;min-height:14px;}
  .quizInputRow{display:flex;gap:6px;}
  .quizInputRow input, #quizCustomForm input{
    flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;
    font-family:var(--font);outline:none;min-width:0;
  }
  #quizCustomForm{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .quizInputRow input:focus, #quizCustomForm input:focus{border-color:var(--moss);}
  #quizSubmit, #quizCustomSend{
    background:var(--moss);color:#fff;border:none;border-radius:8px;padding:9px 14px;
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);
  }
  #quizSubmit:hover, #quizCustomSend:hover{background:var(--moss-dark);}
  .quizSubRow{display:flex;gap:6px;margin-top:6px;}
  .quizSubRow button, .quizActions button{
    flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;
    font-size:12px;cursor:pointer;color:var(--text);font-family:var(--font);
  }
  .quizSubRow button:hover, .quizActions button:hover{background:var(--paper);}
  .quizActions{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
  .quizActions #quizNextBtn{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;padding:10px;}
  .quizActions #quizNextBtn:hover{background:var(--ink-2);}
  .quizResult{text-align:center;font-size:13px;line-height:1.6;padding:12px;border-radius:12px;background:#EAF4EE;color:var(--moss-dark);font-weight:600;}
  .quizResult.giveup{background:var(--paper);color:var(--muted);}
  .quizRule{margin-top:14px;font-size:10.5px;color:var(--muted);line-height:1.6;}
  .quizShake{animation:quizShake .35s;}
  @keyframes quizShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .calHead h2{font-size:14.5px;margin:0;font-weight:700;}
  .calNav{display:flex;gap:4px;}
  .calNav button{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--paper);cursor:pointer;font-size:13px;color:var(--text);
  }
  .calNav button:hover{background:#E4EAE8;}
  #calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px;}
  .calDow{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:600;}
  .calCell{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;font-size:12.5px;cursor:pointer;position:relative;color:var(--text);
  }
  .calCell:hover{background:var(--paper);}
  .calCell.empty{cursor:default;}
  .calCell.today{border:1.5px solid var(--amber);font-weight:700;}
  .calCell.selected{background:var(--moss);color:#fff;}
  .calCell .evtDot{width:4px;height:4px;border-radius:50%;background:var(--moss-dark);margin-top:2px;}
  .calCell.selected .evtDot{background:#fff;}

  #evtSection h3{font-size:13px;margin:0 0 10px;color:var(--text);}
  .evtItem{
    background:var(--paper);border-radius:9px;padding:9px 11px;margin-bottom:7px;
    font-size:12.5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  }
  .evtItem .txt{flex:1;}
  .evtItem .who{color:var(--muted);font-size:10.5px;margin-top:4px;display:flex;align-items:center;gap:4px;}
  .evtItem button{
    border:none;background:none;color:var(--danger);cursor:pointer;font-size:11px;flex-shrink:0;
  }
  .evtEmpty{color:var(--muted);font-size:12px;padding:8px 2px;}
  #evtForm{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  #evtForm input{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;
    font-family:var(--font);outline:none;
  }
  #evtForm input:focus{border-color:var(--moss);}
  #evtForm button{
    background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px;
    font-size:12.5px;font-weight:600;cursor:pointer;
  }
  #evtForm button:hover{background:var(--ink-2);}

  footer.note{
    padding:8px 20px;font-size:10.5px;color:var(--muted);background:var(--paper);
    border-top:1px solid var(--line);flex-shrink:0;
  }

  @media (max-width:760px){
    #layout{flex-direction:column;}
    #calPane{flex:0 0 auto;border-top:1px solid var(--line);}
  }
</style>
</head>
<body>

<!-- 1) 캐릭터 선택 화면 -->
<div id="charScreen">
  <div class="brand">TORI WORLD</div>
  <div class="charWrap" id="charWrap"></div>
</div>

<!-- 2) 비밀번호 설정/입력 화면 -->
<div id="authScreen">
  <div class="authCard">
    <span class="authBack" id="authBack">‹ 캐릭터 다시 선택</span>
    <div class="authIdent">
      <span id="authIconWrap"></span>
      <span class="name" id="authName"></span>
    </div>
    <p id="authDesc"></p>
    <input id="authInput1" type="password" placeholder="비밀번호" autocomplete="off">
    <input id="authInput2" type="password" placeholder="비밀번호 확인" autocomplete="off" style="display:none;">
    <button id="authBtn"></button>
    <div id="authError"></div>
  </div>
</div>

<!-- 3) 메인 앱 -->
<div id="app">
  <header>
    <div class="roomTitle">
      <span class="dot"></span>
      <div>
        <h1>TORI WORLD</h1>
        <span id="pairLabel"></span>
        <span id="otherStatus" class="statusTag"></span>
      </div>
    </div>
    <div id="meLabel"></div>
    <button id="logoutBtn" type="button">나가기</button>
  </header>

  <div id="layout">
    <div id="chatPane">
      <div id="messages"></div>
      <div id="attachPreview"></div>
      <div id="replyPreview">
        <div class="rpText"><span class="rpWho"></span>: <span class="rpSnippet"></span></div>
        <button id="rpCancel" type="button">✕</button>
      </div>
      <div id="composer">
        <button id="emojiBtn" type="button">🙂</button>
        <button id="photoBtn" type="button" title="파일 첨부">📎</button>
        <input type="file" id="imgInput" style="display:none;">
        <div id="emojiPanel"></div>
        <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요..."></textarea>
        <button id="sendBtn">보내기</button>
      </div>
    </div>

    <div id="calPane">
      <div class="paneTabs">
        <button type="button" class="paneTab active" data-tab="cal">📅 일정</button>
        <button type="button" class="paneTab" data-tab="game">🎮 초성퀴즈</button>
      </div>

      <div id="calView">
        <div class="calHead">
          <h2 id="calMonthLabel"></h2>
          <div class="calNav">
            <button id="calPrev">‹</button>
            <button id="calNext">›</button>
          </div>
        </div>
        <div id="calGrid"></div>

        <div id="evtSection">
          <h3 id="evtDateLabel">일정</h3>
          <div id="evtList"></div>
          <div id="evtForm">
            <input id="evtTitle" type="text" placeholder="일정 제목">
            <button id="evtAddBtn">이 날짜에 일정 추가</button>
          </div>
        </div>
      </div>

      <div id="gameView" style="display:none;">
        <div id="scoreBoard"></div>

        <div id="quizEmpty" class="quizEmpty">아직 문제가 없어요.<br>아래 버튼으로 첫 문제를 시작해보세요!</div>

        <div id="quizCard" style="display:none;">
          <div class="quizMeta"><span id="quizRound"></span><span id="quizCategory" class="quizCat"></span></div>
          <div id="quizInitials" class="quizInitials"></div>
          <div id="quizHintLine" class="quizHintLine"></div>
          <div id="quizSetterNote" class="quizSetterNote"></div>

          <div id="quizAnswerBox">
            <div class="quizInputRow">
              <input id="quizGuess" type="text" placeholder="정답을 입력하세요" autocomplete="off">

function esc(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function linkifyText(text){
  const urlRegex = /(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g;
  let parts = [];
  let lastIndex = 0;
  let match;
  while((match = urlRegex.exec(text)) !== null){
    parts.push(esc(text.slice(lastIndex, match.index)));
    const safeUrl = esc(match[0]);
    parts.push('<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + safeUrl + '</a>');
    lastIndex = match.index + match[0].length;
  }
  parts.push(esc(text.slice(lastIndex)));
  return parts.join('');
}

      resolve(result);
    }
    function onOk(){ cleanup(true); }

    okBtn.addEventListener("click", onOk);

  });
}

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function submitAuth(){
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  const v1 = document.getElementById("authInput1").value;

  if(authMode === "set"){
    const v2 = document.getElementById("authInput2").value;
    if(v1.length < 2){ errEl.textContent = "비밀번호를 2자 이상 입력해주세요."; return; }
    if(v1 !== v2){ errEl.textContent = "두 비밀번호가 일치하지 않습니다."; return; }
    await loadAuthMap();
    if(authMap[pendingUser]){
      authMode = "enter";
      openAuthScreen(pendingUser);
      errEl.textContent = "이미 비밀번호가 설정되어 있어요. 입력해주세요.";
      return;
    }
    const hash = await sha256(v1);
    authMap[pendingUser] = hash;
    await saveAuthMap(pendingUser, hash);
    startApp(pendingUser);
  } else {
    const hash = await sha256(v1);
    if(hash === authMap[pendingUser]){
      startApp(pendingUser);
    } else {
      errEl.textContent = "비밀번호가 올바르지 않습니다.";
    }
  }
}

async function loadAuthMap(){

async function saveAuthMap(userName, hash){

  }catch(e){ console.error("비밀번호 저장 실패", e); return false; }
}

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const GIVEUP_MARK = "__giveup__";

function getInitials(word){
  return Array.from(word).map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if(code < 0 || code > 11171) return ch;
    return CHO[Math.floor(code / 588)];
  }).join("");
}
function normalizeAnswer(s){ return (s || "").replace(/\s+/g, "").toLowerCase(); }
function isHangulWord(s){ return /^[가-힣]+$/.test(s); }
function qEl(id){ return document.getElementById(id); }

let quiz = null; // {round, answer, initials, category, setter, solvedBy, hintLevel}
let quizScores = {};
let gameTabActive = false;
let gamePollTimer = null;
let quizLastSeenRound = 0;
let quizBusy = false;

async function loadQuiz(){
  try{
    const [q, s] = await Promise.all([
      sb.from("quiz").select("*").eq("id", "current").maybeSingle(),
      sb.from("quiz_scores").select("*")
    ]);
    if(q.error) throw q.error;
    const row = q.data;
    quiz = (row && row.answer) ? {
      round: Number(row.round), answer: row.answer, initials: row.initials,
      category: row.category || "", setter: row.setter || null,
      solvedBy: row.solved_by || null, hintLevel: Number(row.hint_level || 0)
    } : null;
    quizScores = {};
    ((s && s.data) || []).forEach(r => { quizScores[r.user_name] = Number(r.score); });
  }catch(e){ console.error("퀴즈 불러오기 실패", e); }
}

function updateQuizDot(){
  const tab = document.querySelector('.paneTab[data-tab="game"]');
  if(!tab) return;
  const isNew = quiz && quiz.round !== quizLastSeenRound && !quiz.solvedBy && quiz.setter !== currentUser;
  tab.classList.toggle("dot", !!isNew && !gameTabActive);
}

function renderGame(){
  if(!currentUser) return;
  // 점수판
  qEl("scoreBoard").innerHTML = CONFIG.CHARACTERS.map(c =>
    '<div class="scoreCell' + (c.name === currentUser ? ' me' : '') + '">' + iconHtml(c, 20)
    + '<span>' + esc(c.name) + '</span><span class="sc">' + (quizScores[c.name] || 0) + '</span></div>'
  ).join("");

  const hasQuiz = !!quiz;
  qEl("quizEmpty").style.display = hasQuiz ? "none" : "block";
  qEl("quizCard").style.display = hasQuiz ? "block" : "none";
  if(!hasQuiz) return;

  const letters = Array.from(quiz.answer);
  qEl("quizRound").textContent = "제 " + quiz.round + " 라운드";
  const catEl = qEl("quizCategory");
  catEl.textContent = quiz.category || "분류 없음";
  qEl("quizInitials").textContent = quiz.initials;

  const hintLine = quiz.hintLevel > 0
    ? letters.map((c, i) => i < quiz.hintLevel ? c : "○").join(" ")
    : "";
  qEl("quizHintLine").textContent = (!quiz.solvedBy && hintLine) ? hintLine : "";

  const isSetter = quiz.setter === currentUser;
  qEl("quizSetterNote").textContent = quiz.setter
    ? (isSetter ? "내가 낸 문제예요 — 상대방이 푸는 중!" : quiz.setter + "님이 낸 문제")
    : "";

  const solved = !!quiz.solvedBy;
  qEl("quizAnswerBox").style.display = (!solved && !isSetter) ? "block" : "none";

  const maxHint = Math.min(2, letters.length - 1);
  const hintBtn = qEl("quizHintBtn");
  hintBtn.disabled = quiz.hintLevel >= maxHint;
  hintBtn.textContent = quiz.hintLevel >= maxHint ? "💡 힌트 소진" : "💡 힌트 (−1점)";

  const resultEl = qEl("quizResult");
  if(solved){
    resultEl.style.display = "block";
    if(quiz.solvedBy === GIVEUP_MARK){
      resultEl.className = "quizResult giveup";
      resultEl.textContent = "🏳 포기! 정답은 「" + quiz.answer + "」";
    } else {
      const pts = Math.max(1, 3 - quiz.hintLevel);
      resultEl.className = "quizResult";
      resultEl.textContent = "🎉 " + quiz.solvedBy + "님 정답! 「" + quiz.answer + "」 (+" + pts + "점)";
    }
  } else {
    resultEl.style.display = "none";
  }
  qEl("quizNextBtn").textContent = solved ? "🎲 다음 문제 (자동 출제)" : "🎲 새 문제 (자동 출제)";
}

function switchPaneTab(tab){
  gameTabActive = (tab === "game");
  document.querySelectorAll(".paneTab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  qEl("calView").style.display = gameTabActive ? "none" : "";
  qEl("gameView").style.display = gameTabActive ? "" : "none";
  if(gameTabActive){
    loadQuiz().then(() => {
      quizLastSeenRound = quiz ? quiz.round : 0;
      updateQuizDot();
      renderGame();
    });
    startGamePoll();
  } else {
    stopGamePoll();
  }
}
function startGamePoll(){
  if(gamePollTimer) return;
  gamePollTimer = setInterval(async () => {
    if(!currentUser || quizBusy) return;
    await loadQuiz();
    quizLastSeenRound = quiz ? quiz.round : 0;
    renderGame();
  }, 2000);
}
function stopGamePoll(){
  if(gamePollTimer){ clearInterval(gamePollTimer); gamePollTimer = null; }
}

async function publishQuestion(answer, category, setter){
  const cur = await sb.from("quiz").select("round").eq("id", "current").maybeSingle();
  const base = (cur && cur.data) ? Number(cur.data.round) : 0;
  const { error } = await sb.from("quiz").upsert({
    id: "current", round: base + 1, answer: answer, initials: getInitials(answer),
    category: category || "", setter: setter, solved_by: null, hint_level: 0, updated_at: Date.now()
  });
  if(error) throw error;
}

async function startAutoQuestion(){
  if(quizBusy) return;
  quizBusy = true;
  try{
    const prev = quiz ? quiz.answer : null;
    let pick;
    do { pick = QUIZ_WORDS[Math.floor(Math.random() * QUIZ_WORDS.length)]; }
    while(QUIZ_WORDS.length > 1 && pick[0] === prev);
    await publishQuestion(pick[0], pick[1], null);
    await postSystemMessage("🎲 " + currentUser + "님이 새 초성퀴즈를 시작했어요! (🎮 탭에서 확인)");
    await loadQuiz();
    quizLastSeenRound = quiz ? quiz.round : 0;
    qEl("quizGuess").value = "";
    renderGame();
    renderMessages();
  }catch(e){
    console.error(e);
    showToast("문제를 만들지 못했어요. Supabase에 퀴즈 테이블이 만들어졌는지 확인해주세요.");
  }finally{ quizBusy = false; }
}

async function sendCustomQuestion(){
  if(quizBusy) return;
  const answer = normalizeAnswer(qEl("quizCustomAnswer").value);
  const cat = qEl("quizCustomCat").value.trim().slice(0, 12);
  if(!isHangulWord(answer) || answer.length < 2 || answer.length > 10){
    showToast("정답은 한글 2~10자로 입력해주세요. (공백 제외)");
    return;
  }
  quizBusy = true;
  try{
    await publishQuestion(answer, cat, currentUser);
    await postSystemMessage("✏️ " + currentUser + "님이 초성퀴즈를 냈어요! 🎮 탭에서 풀어보세요.");
    qEl("quizCustomAnswer").value = "";
    qEl("quizCustomCat").value = "";
    qEl("quizCustomForm").style.display = "none";
    await loadQuiz();
    quizLastSeenRound = quiz ? quiz.round : 0;
    renderGame();
    renderMessages();
    showToast("문제를 냈어요! 상대방이 풀 때까지 기다려주세요.");
  }catch(e){
    console.error(e);
    showToast("문제를 내지 못했어요. 다시 시도해주세요.");
  }finally{ quizBusy = false; }
}

async function submitGuess(){
  if(quizBusy || !quiz || quiz.solvedBy || quiz.setter === currentUser) return;
  const input = qEl("quizGuess");
  const guess = normalizeAnswer(input.value);
  if(!guess) return;
  if(guess !== normalizeAnswer(quiz.answer)){
    input.classList.remove("quizShake");
    void input.offsetWidth;
    input.classList.add("quizShake");
    showToast("땡! 다시 도전해보세요 🙈");
    return;
  }
  quizBusy = true;
  try{
    const answer = quiz.answer;
    const { data, error } = await sb.from("quiz")
      .update({ solved_by: currentUser, updated_at: Date.now() })
      .eq("id", "current").eq("round", quiz.round).is("solved_by", null).select();
    if(error) throw error;
    input.value = "";
    if(!data || data.length === 0){
      showToast("앗, 상대방이 먼저 맞혔어요!");
    } else {
      const pts = Math.max(1, 3 - Number(data[0].hint_level || 0));
      quizScores[currentUser] = (quizScores[currentUser] || 0) + pts;
      await sb.from("quiz_scores").upsert({ user_name: currentUser, score: quizScores[currentUser] });
      await postSystemMessage("🎮 " + currentUser + "님이 초성퀴즈 정답! 「" + answer + "」 (+" + pts + "점)");
      renderMessages();
    }
    await loadQuiz();
    renderGame();
  }catch(e){
    console.error(e);
    showToast("제출에 실패했어요. 다시 시도해주세요.");
  }finally{ quizBusy = false; }
}

async function useHint(){
  if(quizBusy || !quiz || quiz.solvedBy || quiz.setter === currentUser) return;
  const maxHint = Math.min(2, Array.from(quiz.answer).length - 1);
  if(quiz.hintLevel >= maxHint) return;
  quizBusy = true;
  try{
    const { error } = await sb.from("quiz")
      .update({ hint_level: quiz.hintLevel + 1, updated_at: Date.now() })
      .eq("id", "current").eq("round", quiz.round).eq("hint_level", quiz.hintLevel).is("solved_by", null);
    if(error) throw error;
    await loadQuiz();
    renderGame();
  }catch(e){
    console.error(e);
    showToast("힌트를 가져오지 못했어요.");
  }finally{ quizBusy = false; }
}

async function giveUpQuiz(){
  if(quizBusy || !quiz || quiz.solvedBy || quiz.setter === currentUser) return;
  quizBusy = true;
  try{
    const answer = quiz.answer;
    const { data, error } = await sb.from("quiz")
      .update({ solved_by: GIVEUP_MARK, updated_at: Date.now() })
      .eq("id", "current").eq("round", quiz.round).is("solved_by", null).select();
    if(error) throw error;
    if(data && data.length > 0){
      await postSystemMessage("🏳 " + currentUser + "님이 포기! 정답은 「" + answer + "」였어요.");
      renderMessages();
    }
    await loadQuiz();
    renderGame();
  }catch(e){
    console.error(e);
    showToast("처리하지 못했어요. 다시 시도해주세요.");
  }finally{ quizBusy = false; }
}

/* ---------------- 오래된 메시지/사진 자동 정리 ---------------- */
async function pruneOldData(){
  const cutoff = Date.now() - CONFIG.RETENTION_DAYS * 24 * 60 * 60 * 1000;
  let toDelete = messages.filter(m => m.ts < cutoff);

  if(messages.length > CONFIG.MAX_MESSAGES){
    const excess = messages.length - CONFIG.MAX_MESSAGES;
    const oldestExcess = messages.slice(0, excess);
    oldestExcess.forEach(m => { if(!toDelete.includes(m)) toDelete.push(m); });
  }
  if(toDelete.length === 0) return;

  const deleteIds = toDelete.map(m => m.id);
  try{ await sb.from("messages").delete().in("id", deleteIds); }
  catch(e){ console.error("자동 정리(메시지) 실패", e); }

  for(const m of toDelete){
    if((m.type === "image" || m.type === "file") && m.imgKey){
      try{ await sb.from("images").delete().eq("key", m.imgKey); }
      catch(e){ /* 무시 */ }
      delete imageCache[m.imgKey];
      delete fileCache[m.imgKey];
    }
  }
  const deleteSet = new Set(deleteIds);
  messages = messages.filter(m => !deleteSet.has(m.id));
}

const imageCache = {}; // imgKey -> dataURL (사진 미리보기용 메모리 캐시)
const fileCache = {};  // fileKey -> dataURL (일반 파일 다운로드용 메모리 캐시)

  document.getElementById("imgInput").click();
});

  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  stageAttachment(file);
});

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function formatFileSize(bytes){
  if(bytes < 1024) return bytes + "B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + "KB";
  return (bytes/1024/1024).toFixed(1) + "MB";
}

let pendingAttachment = null; // {file, kind:'image'|'file', previewUrl, name, size}

function stageAttachment(file){
  const isImage = !!(file.type && file.type.startsWith("image/"));
  if(!isImage && file.size > CONFIG.MAX_FILE_BYTES){
    showToast("4MB 이하 파일만 첨부할 수 있어요.");
    return;
  }
  if(pendingAttachment && pendingAttachment.previewUrl) URL.revokeObjectURL(pendingAttachment.previewUrl);
  pendingAttachment = {
    file, kind: isImage ? "image" : "file",
    previewUrl: isImage ? URL.createObjectURL(file) : null,
    name: file.name, size: file.size
  };
  renderAttachPreview();
  document.getElementById("msgInput").focus();
}

function clearAttachment(){
  if(pendingAttachment && pendingAttachment.previewUrl) URL.revokeObjectURL(pendingAttachment.previewUrl);
  pendingAttachment = null;
  renderAttachPreview();
}

function renderAttachPreview(){
  const bar = document.getElementById("attachPreview");
  if(!pendingAttachment){
    bar.classList.remove("show");
    bar.innerHTML = "";
    return;
  }
  bar.classList.add("show");
  if(pendingAttachment.kind === "image"){
    bar.innerHTML = '<img class="apThumb" src="' + pendingAttachment.previewUrl + '"><span class="apName">사진 첨부됨 — 보내기를 누르면 전송돼요</span><button id="apCancel" type="button">✕</button>';
  } else {
    bar.innerHTML = '<span class="apIcon">📄</span><span class="apName">' + esc(pendingAttachment.name) + '</span><button id="apCancel" type="button">✕</button>';
  }
  document.getElementById("apCancel").addEventListener("click", clearAttachment);
}

// 캡처/복사한 이미지를 입력창에 Ctrl+V로 붙여넣으면 미리보기로 첨부됨 (전송은 '보내기' 버튼으로)
document.getElementById("msgInput").addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.kind === "file"){
      e.preventDefault();
      const file = item.getAsFile();
      if(file) stageAttachment(file);
      return;
    }
  }
  // 파일이 아니면(일반 텍스트 붙여넣기) 기본 동작 그대로 둠
});

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("이미지를 열지 못했습니다."));
      img.onload = () => {
        const maxSide = 1000;
        let w = img.width, h = img.height;
        if(w > maxSide || h > maxSide){
          if(w >= h){ h = Math.round(h * maxSide / w); w = maxSide; }
          else{ w = Math.round(w * maxSide / h); h = maxSide; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let quality = 0.75;
        let out = canvas.toDataURL("image/jpeg", quality);
        // 4MB 넘으면 품질을 낮춰 다시 시도 (저장소 5MB 제한 대비 여유 확보)
        while(out.length > 4 * 1024 * 1024 && quality > 0.3){
          quality -= 0.15;
          out = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function snippetOf(m){
  if(m.type === "image") return "[사진]";
  if(m.type === "file") return "[파일] " + (m.fileName || "");
  return m.text.length > 40 ? m.text.slice(0,40) + "…" : m.text;
}

    replyToId: rt ? rt.id : null, replyToSender: rt ? rt.sender : null, replyToSnippet: rt ? snippetOf(rt) : null
  };

    reply_to_id: msg.replyToId, reply_to_sender: msg.replyToSender, reply_to_snippet: msg.replyToSnippet
  });

  renderMessages();
  markRead();
}

async function fetchImageAndRerender(imgKey){
  try{
    const { data, error } = await sb.from("images").select("data").eq("key", imgKey).single();
    if(error) throw error;
    imageCache[imgKey] = data.data;
    renderMessages();
  }catch(err){
    imageCache[imgKey] = null; // 실패 표시 (재요청 방지)
  }
}

async function sendFileMessage(dataUrl, name, mime, size){
  const fileKey = "file-" + Date.now() + "-" + Math.random().toString(36).slice(2,7);
  const { error: fErr } = await sb.from("images").insert({ key: fileKey, data: dataUrl, name: name, mime: mime, size: size });
  if(fErr) throw new Error("파일 저장 실패");
  fileCache[fileKey] = dataUrl;

  const rt = replyTarget;
  const msg = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    sender: currentUser, type: "file", imgKey: fileKey,
    fileName: name, fileMime: mime, fileSize: size, ts: Date.now(),
    replyToId: rt ? rt.id : null, replyToSender: rt ? rt.sender : null, replyToSnippet: rt ? snippetOf(rt) : null
  };
  const { error } = await sb.from("messages").insert({
    id: msg.id, sender: msg.sender, type: "file", img_key: fileKey, ts: msg.ts,
    file_name: name, file_mime: mime, file_size: size,
    reply_to_id: msg.replyToId, reply_to_sender: msg.replyToSender, reply_to_snippet: msg.replyToSnippet
  });
  if(error){ console.error("메시지 저장 실패", error); return; }
  messages.push(msg);
  clearReplyTarget();
  renderMessages();
  markRead();
}

async function downloadAttachedFile(fileKey, name){
  let dataUrl = fileCache[fileKey];
  if(!dataUrl){
    try{
      const { data, error } = await sb.from("images").select("data").eq("key", fileKey).single();
      if(error) throw error;
      dataUrl = data.data;
      fileCache[fileKey] = dataUrl;
    }catch(err){
      showToast("파일을 불러오지 못했어요.");
      return;
    }
  }
  const a = document.createElement("a");
  a.href = dataUrl;
  a.download = name || "file";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById("imgViewer").addEventListener("click", () => {
  document.getElementById("imgViewer").style.display = "none";
});

async function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!pendingAttachment && !text) return;

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;
  try{
    if(pendingAttachment){
      const att = pendingAttachment;
      clearAttachment();
      try{
        if(att.kind === "image"){
          const dataUrl = await compressImage(att.file);
          await sendImageMessage(dataUrl);
        } else {
          const dataUrl = await fileToDataUrl(att.file);
          await sendFileMessage(dataUrl, att.name, att.file.type || "application/octet-stream", att.size);
        }
      }catch(err){
        console.error(err);
        showToast("파일을 보내지 못했어요. 다시 시도해주세요.");
      }
    }

    if(text){
      const rt = replyTarget;
      const msg = {
        id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
        sender: currentUser, type: "text", text: text, ts: Date.now(),
        replyToId: rt ? rt.id : null, replyToSender: rt ? rt.sender : null, replyToSnippet: rt ? snippetOf(rt) : null
      };
      const { error } = await sb.from("messages").insert({
        id: msg.id, sender: msg.sender, type: "text", text: msg.text, ts: msg.ts,
        reply_to_id: msg.replyToId, reply_to_sender: msg.replyToSender, reply_to_snippet: msg.replyToSnippet
      });
      if(error){ console.error("메시지 저장 실패", error); }
      else{
        messages.push(msg);
        input.value = "";
        input.style.height = "auto";
        clearReplyTarget();
        renderMessages();
        markRead();
      }
    }
  } finally {
    sendBtn.disabled = false;
  }
}

async function deleteMessage(id){
  const idx = messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const ok = await customConfirm("이 메시지를 삭제할까요?");
  if(!ok) return;
  const m = messages[idx];
  try{ await sb.from("messages").delete().eq("id", id); }
  catch(e){ console.error("메시지 삭제 실패", e); return; }
  messages.splice(idx, 1);
  if((m.type === "image" || m.type === "file") && m.imgKey){
    try{ await sb.from("images").delete().eq("key", m.imgKey); }
    catch(e){ /* 무시 */ }
    delete imageCache[m.imgKey];
    delete fileCache[m.imgKey];
  }
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById("messages");
  const distanceFromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
  box.innerHTML = "";
  let lastSender = null;
  messages.forEach(m => {
    if(m.type === "system"){
      const sys = document.createElement("div");
      sys.className = "sysMsg";
      sys.textContent = m.text;
      box.appendChild(sys);
      lastSender = null;
      return;
    }
    if(m.sender !== lastSender){
      const c = charInfo(m.sender);
      const tag = document.createElement("div");
      tag.className = "senderTag";
      tag.style.alignSelf = m.sender === currentUser ? "flex-end" : "flex-start";
      tag.innerHTML = iconHtml(c, 15) + "<span>" + esc(m.sender) + "</span>";
      box.appendChild(tag);
      lastSender = m.sender;
    }
    const row = document.createElement("div");
    row.className = "msgRow " + (m.sender === currentUser ? "me" : "other");
    row.dataset.ts = m.ts;
    row.dataset.mine = m.sender === currentUser ? "1" : "0";

    if(m.replyToSnippet){
      const quote = document.createElement("div");
      quote.className = "quoteBlock";
      quote.innerHTML = "<b>" + esc(m.replyToSender || "") + "</b>: " + esc(m.replyToSnippet);
      row.appendChild(quote);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if(m.type === "image"){
      const cached = imageCache[m.imgKey];
      if(cached){
        const wrap = document.createElement("div");
        wrap.className = "imgThumbWrap";
        const imgEl = document.createElement("img");
        imgEl.src = cached;
        const badge = document.createElement("span");
        badge.className = "zoomBadge";
        badge.textContent = "🔍 확대";
        wrap.appendChild(imgEl);
        wrap.appendChild(badge);
        wrap.onclick = () => {
          document.getElementById("imgViewerImg").src = cached;
          document.getElementById("imgViewer").style.display = "flex";
        };
        bubble.style.padding = "0";
        bubble.appendChild(wrap);
      } else if(cached === null){
        bubble.classList.add("imgLoading");
        bubble.textContent = "사진을 불러오지 못했어요";
      } else {
        bubble.classList.add("imgLoading");
        bubble.textContent = "사진 불러오는 중...";
        fetchImageAndRerender(m.imgKey);
      }
    } else if(m.type === "file"){
      bubble.classList.add("fileCard");
      const icon = document.createElement("span");
      icon.className = "fileIcon";
      icon.textContent = "📄";
      const info = document.createElement("div");
      info.className = "fileInfo";
      const nameEl = document.createElement("div");
      nameEl.className = "fileName";
      nameEl.textContent = m.fileName || "파일";
      const sizeEl = document.createElement("div");
      sizeEl.className = "fileSize";
      sizeEl.textContent = m.fileSize ? formatFileSize(m.fileSize) + " · 눌러서 다운로드" : "눌러서 다운로드";
      info.appendChild(nameEl);
      info.appendChild(sizeEl);
      bubble.appendChild(icon);
      bubble.appendChild(info);
      bubble.onclick = () => downloadAttachedFile(m.imgKey, m.fileName);
    } else {
      bubble.innerHTML = linkifyText(m.text);
    }
    row.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "metaRow";
    const time = new Date(m.ts);
    let metaHtml = time.getHours().toString().padStart(2,"0") + ":" + time.getMinutes().toString().padStart(2,"0");
    const replyBtn = document.createElement("span");
    replyBtn.className = "actionBtn";
    replyBtn.textContent = "답장";
    replyBtn.onclick = () => setReplyTarget(m);
    if(m.sender === currentUser){
      const readTag = document.createElement("span");
      readTag.className = "readTag";
      meta.textContent = metaHtml;
      meta.appendChild(readTag);
      meta.appendChild(replyBtn);
      const delBtn = document.createElement("span");
      delBtn.className = "actionBtn";
      delBtn.textContent = "삭제";
      delBtn.onclick = () => deleteMessage(m.id);
      meta.appendChild(delBtn);
    } else {
      meta.textContent = metaHtml;
      meta.appendChild(replyBtn);
    }
    row.appendChild(meta);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight - box.clientHeight - distanceFromBottom;
  updateReadTags();
}

function updateReadTags(){
  const otherReadTs = reads[otherUser()] || 0;
  document.querySelectorAll('.msgRow[data-mine="1"]').forEach(row => {
    const ts = Number(row.dataset.ts);
    const tag = row.querySelector(".readTag");
    if(tag) tag.textContent = ts <= otherReadTs ? " 읽음" : " 전송됨";
  });
}

async function markRead(){
  const latestOtherMsgTs = messages
    .filter(m => m.sender !== currentUser)
    .reduce((max, m) => Math.max(max, m.ts), 0);
  if(latestOtherMsgTs > (reads[currentUser] || 0)){
    const now = Date.now();
    reads[currentUser] = now;
    try{ await sb.from("reads").upsert({ user_name: currentUser, ts: now }); }
    catch(e){ console.error("읽음 정보 저장 실패", e); }
  }
  updateReadTags();
}

/* ---------------- 캘린더 ---------------- */
document.getElementById("calPrev").addEventListener("click", () => { calViewDate.setMonth(calViewDate.getMonth()-1); renderCalendar(); });
document.getElementById("calNext").addEventListener("click", () => { calViewDate.setMonth(calViewDate.getMonth()+1); renderCalendar(); });
document.getElementById("evtAddBtn").addEventListener("click", addEvent);
document.getElementById("evtTitle").addEventListener("keydown", e => { if(e.key === "Enter") addEvent(); });

function renderCalendar(){
  const year = calViewDate.getFullYear();
  const month = calViewDate.getMonth();
  document.getElementById("calMonthLabel").textContent = year + "년 " + (month+1) + "월";

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  ["일","월","화","수","목","금","토"].forEach(d => {
    const el = document.createElement("div");
    el.className = "calDow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();

  for(let i=0;i<firstDay;i++){
    const el = document.createElement("div");
    el.className = "calCell empty";
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cell = document.createElement("div");
    cell.className = "calCell";
    if(dateStr === today) cell.classList.add("today");
    if(dateStr === selectedDate) cell.classList.add("selected");
    cell.innerHTML = d;
    if(events.some(ev => ev.date === dateStr)){
      const dot = document.createElement("div");
      dot.className = "evtDot";
      cell.appendChild(dot);
    }
    cell.onclick = () => { selectedDate = dateStr; renderCalendar(); renderEvents(); };
    grid.appendChild(cell);
  }
  renderEvents();
}

function renderEvents(){
  document.getElementById("evtDateLabel").textContent = selectedDate + " 일정";
  const list = document.getElementById("evtList");
  list.innerHTML = "";
  const dayEvents = events.filter(ev => ev.date === selectedDate).sort((a,b)=>a.ts-b.ts);
  if(dayEvents.length === 0){
    const empty = document.createElement("div");
    empty.className = "evtEmpty";
    empty.textContent = "등록된 일정이 없습니다.";
    list.appendChild(empty);
  } else {
    dayEvents.forEach(ev => {
      const c = charInfo(ev.creator);
      const item = document.createElement("div");
      item.className = "evtItem";
      item.innerHTML = '<div class="txt">' + esc(ev.title) + '<div class="who">' + iconHtml(c,13) + ' ' + esc(ev.creator) + '</div></div>';
      const delBtn = document.createElement("button");
      delBtn.textContent = "삭제";
      delBtn.onclick = () => deleteEvent(ev.id);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }
}

async function addEvent(){
  const titleInput = document.getElementById("evtTitle");
  const title = titleInput.value.trim();
  if(!title) return;
  const ev = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    date: selectedDate, title: title, creator: currentUser, ts: Date.now()
  };
  const { error } = await sb.from("events").insert(ev);
  if(error){ console.error("일정 저장 실패", error); return; }
  events.push(ev);
  titleInput.value = "";
  renderCalendar();
}

async function deleteEvent(id){
  try{ await sb.from("events").delete().eq("id", id); }
  catch(e){ console.error("일정 삭제 실패", e); return; }
  events = events.filter(ev => ev.id !== id);
  renderCalendar();
}

  await loadAuthMap();
  renderCharScreen();
