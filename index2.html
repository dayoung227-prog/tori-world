<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORI WORLD</title>
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#242F3F;
    --paper:#EFF2F1;
    --card:#FFFFFF;
    --line:#DDE3E1;
    --text:#23282D;
    --muted:#8B95A1;
    --moss:#5C8374;
    --moss-dark:#456357;
    --amber:#D9A441;
    --danger:#C0564B;
    --duck:#4C9A6A;
    --rabbit:#2B2E33;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 캐릭터 선택 화면 ---------- */
  #charScreen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(92,131,116,0.20), transparent 60%),
      var(--ink);
    flex-direction:column;
  }
  .brand{
    color:#F4F6F5;font-size:13px;letter-spacing:4px;font-weight:700;margin-bottom:26px;opacity:.8;
  }
  .charWrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px;}
  .charCard{
    width:150px;
    background:var(--ink-2);
    border:1.5px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:26px 16px 20px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
  }
  .charCard:hover{border-color:var(--accent,var(--moss));transform:translateY(-2px);}
  .charCard .iconWrap{display:flex;justify-content:center;margin-bottom:12px;}
  .charCard .cname{color:#F4F6F5;font-size:14.5px;font-weight:700;}
  .charCard .cstate{color:#9AA6AE;font-size:11px;margin-top:5px;}

  /* ---------- 비밀번호 설정/입력 화면 ---------- */
  #authScreen{
    height:100vh;display:none;align-items:center;justify-content:center;
    background:var(--ink);
  }
  .authCard{
    width:340px;
    max-width:88vw;
    background:var(--ink-2);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:30px 28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .authBack{
    color:#8FA0A8;font-size:12px;cursor:pointer;margin-bottom:14px;display:inline-block;
  }
  .authBack:hover{color:#fff;}
  .authIdent{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .authIdent .name{color:#F4F6F5;font-size:16px;font-weight:700;}
  .authCard p{color:#9AA6AE;font-size:12.5px;margin:0 0 16px;line-height:1.6;}
  .authCard input{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.05);
    color:#F4F6F5;
    font-size:14.5px;
    letter-spacing:2px;
    outline:none;
    margin-bottom:9px;
  }
  .authCard input:focus{border-color:var(--moss);}
  .authCard button{
    width:100%;
    margin-top:6px;
    padding:12px;
    border:none;
    border-radius:9px;
    background:var(--moss);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .authCard button:hover{background:var(--moss-dark);}
  #authError{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
    min-height:16px;
  }

  /* ---------- 메인 앱 ---------- */
  #app{display:none;height:100vh;flex-direction:column;}
  header{
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .roomTitle{display:flex;align-items:center;gap:10px;}
  .roomTitle .dot{width:8px;height:8px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 3px rgba(92,131,116,0.25);}
  .roomTitle h1{font-size:15px;margin:0;font-weight:700;letter-spacing:1px;}
  .roomTitle span{font-size:11.5px;color:#9AA6AE;display:block;margin-top:2px;}
  .statusTag{display:inline-block !important;margin-top:0 !important;margin-left:4px;}
  .sysMsg{
    text-align:center;font-size:11px;color:var(--muted);margin:10px 0;
  }
  #meLabel{
    font-size:12.5px;color:#C6D0CB;background:rgba(255,255,255,0.08);
    padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;
  }
  #logoutBtn{
    font-size:11.5px;color:#C6D0CB;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;cursor:pointer;
    margin-left:8px;flex-shrink:0;
  }
  #logoutBtn:hover{background:rgba(255,255,255,0.16);}

  #layout{flex:1;display:flex;overflow:hidden;}

  /* 채팅 영역 */
  #chatPane{
    flex:1 1 62%;
    display:flex;flex-direction:column;
    background:var(--paper);
    border-right:1px solid var(--line);
    min-width:0;
  }
  #messages{
    flex:1;overflow-y:auto;padding:22px 22px 10px;
    display:flex;flex-direction:column;gap:4px;
  }
  .msgRow{display:flex;flex-direction:column;max-width:68%;}
  .msgRow.me{align-self:flex-end;align-items:flex-end;}
  .msgRow.other{align-self:flex-start;align-items:flex-start;}
  .bubble{
    padding:10px 14px;border-radius:14px;font-size:12.5px;line-height:1.5;
    word-break:break-word;white-space:pre-wrap;
  }
  .msgRow.me .bubble{background:var(--moss);color:#fff;border-bottom-right-radius:4px;}
  .msgRow.other .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msgRow.me .bubble a{color:#fff;text-decoration:underline;word-break:break-all;}
  .msgRow.other .bubble a{color:var(--moss-dark);text-decoration:underline;word-break:break-all;}
  .metaRow{font-size:10.5px;color:var(--muted);margin-top:3px;padding:0 3px;display:flex;gap:6px;align-items:center;}
  .metaRow .readTag{color:var(--moss-dark);font-weight:600;}
  .metaRow .actionBtn{cursor:pointer;text-decoration:underline;}
  .senderTag{font-size:11px;color:var(--muted);margin:12px 0 3px 3px;display:flex;align-items:center;gap:5px;}
  .quoteBlock{
    font-size:11px;color:var(--muted);background:rgba(0,0,0,0.05);
    border-left:3px solid var(--moss);padding:4px 8px;border-radius:6px;
    margin-bottom:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .quoteBlock b{color:var(--moss-dark);}

  #replyPreview{
    display:none;align-items:center;justify-content:space-between;
    background:var(--paper);border-top:1px solid var(--line);
    padding:8px 16px;flex-shrink:0;
  }
  #replyPreview.show{display:flex;}
  #replyPreview .rpText{
    font-size:12px;color:var(--text);border-left:3px solid var(--moss);
    padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:85%;
  }
  #replyPreview .rpWho{font-weight:700;color:var(--moss-dark);}
  #rpCancel{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px;}

  #composer{
    border-top:1px solid var(--line);
    background:#fff;
    padding:12px 16px;
    display:flex;align-items:flex-end;gap:8px;
    position:relative;
    flex-shrink:0;
  }
  #emojiBtn, #photoBtn{
    width:38px;height:38px;flex-shrink:0;border-radius:9px;border:1px solid var(--line);
    background:var(--paper);font-size:18px;cursor:pointer;
  }
  #emojiBtn:hover, #photoBtn:hover{background:#E4EAE8;}
  #photoBtn:disabled{opacity:.5;cursor:default;}
  .bubble img{
    max-width:220px;max-height:220px;border-radius:10px;display:block;cursor:pointer;
  }
  .bubble.imgLoading{
    width:150px;height:100px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;color:var(--muted);
  }
  .msgRow.other .bubble.imgLoading, .msgRow.me .bubble.imgLoading{background:var(--paper);color:var(--muted);border:1px dashed var(--line);}
  .bubble.fileCard{
    display:flex;align-items:center;gap:10px;cursor:pointer;min-width:180px;
  }
  .fileIcon{font-size:22px;flex-shrink:0;}
  .fileInfo{overflow:hidden;}
  .fileName{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;}
  .fileSize{font-size:10.5px;opacity:.8;margin-top:2px;}
  #imgViewer{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:999;
    align-items:center;justify-content:center;cursor:zoom-out;
  }
  #imgViewer img{max-width:92vw;max-height:92vh;border-radius:6px;}
  #msgInput{
    flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:12.5px;font-family:var(--font);max-height:120px;outline:none;
  }
  #msgInput:focus{border-color:var(--moss);}
  #sendBtn{
    background:var(--moss);color:#fff;border:none;border-radius:10px;
    padding:0 18px;height:40px;font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  #sendBtn:hover{background:var(--moss-dark);}
  #emojiPanel{
    position:absolute;bottom:60px;left:16px;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 30px rgba(27,36,48,0.15);
    padding:10px;display:none;
    grid-template-columns:repeat(8,1fr);gap:2px;width:280px;
  }
  #emojiPanel span{
    font-size:19px;text-align:center;padding:6px 0;border-radius:6px;cursor:pointer;
  }
  #emojiPanel span:hover{background:var(--paper);}

  /* 캘린더 영역 */
  #calPane{
    flex:0 0 340px;
    background:#fff;
    overflow-y:auto;
    padding:20px;
  }
  .calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .calHead h2{font-size:14.5px;margin:0;font-weight:700;}
  .calNav{display:flex;gap:4px;}
  .calNav button{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--paper);cursor:pointer;font-size:13px;color:var(--text);
  }
  .calNav button:hover{background:#E4EAE8;}
  #calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px;}
  .calDow{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:600;}
  .calCell{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;font-size:12.5px;cursor:pointer;position:relative;color:var(--text);
  }
  .calCell:hover{background:var(--paper);}
  .calCell.empty{cursor:default;}
  .calCell.today{border:1.5px solid var(--amber);font-weight:700;}
  .calCell.selected{background:var(--moss);color:#fff;}
  .calCell .evtDot{width:4px;height:4px;border-radius:50%;background:var(--moss-dark);margin-top:2px;}
  .calCell.selected .evtDot{background:#fff;}

  #evtSection h3{font-size:13px;margin:0 0 10px;color:var(--text);}
  .evtItem{
    background:var(--paper);border-radius:9px;padding:9px 11px;margin-bottom:7px;
    font-size:12.5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  }
  .evtItem .txt{flex:1;}
  .evtItem .who{color:var(--muted);font-size:10.5px;margin-top:4px;display:flex;align-items:center;gap:4px;}
  .evtItem button{
    border:none;background:none;color:var(--danger);cursor:pointer;font-size:11px;flex-shrink:0;
  }
  .evtEmpty{color:var(--muted);font-size:12px;padding:8px 2px;}
  #evtForm{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  #evtForm input{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;
    font-family:var(--font);outline:none;
  }
  #evtForm input:focus{border-color:var(--moss);}
  #evtForm button{
    background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px;
    font-size:12.5px;font-weight:600;cursor:pointer;
  }
  #evtForm button:hover{background:var(--ink-2);}

  footer.note{
    padding:8px 20px;font-size:10.5px;color:var(--muted);background:var(--paper);
    border-top:1px solid var(--line);flex-shrink:0;
  }

  @media (max-width:760px){
    #layout{flex-direction:column;}
    #calPane{flex:0 0 auto;border-top:1px solid var(--line);}
  }
</style>
</head>
<body>

<!-- 1) 캐릭터 선택 화면 -->
<div id="charScreen">
  <div class="brand">TORI WORLD</div>
  <div class="charWrap" id="charWrap"></div>
</div>

<!-- 2) 비밀번호 설정/입력 화면 -->
<div id="authScreen">
  <div class="authCard">
    <span class="authBack" id="authBack">‹ 캐릭터 다시 선택</span>
    <div class="authIdent">
      <span id="authIconWrap"></span>
      <span class="name" id="authName"></span>
    </div>
    <p id="authDesc"></p>
    <input id="authInput1" type="password" placeholder="비밀번호" autocomplete="off">
    <input id="authInput2" type="password" placeholder="비밀번호 확인" autocomplete="off" style="display:none;">
    <button id="authBtn"></button>
    <div id="authError"></div>
  </div>
</div>

<!-- 3) 메인 앱 -->
<div id="app">
  <header>
    <div class="roomTitle">
      <span class="dot"></span>
      <div>
        <h1>TORI WORLD</h1>
        <span id="pairLabel"></span>
        <span id="otherStatus" class="statusTag"></span>
      </div>
    </div>
    <div id="meLabel"></div>
    <button id="logoutBtn" type="button">나가기</button>
  </header>

  <div id="layout">
    <div id="chatPane">
      <div id="messages"></div>
      <div id="replyPreview">
        <div class="rpText"><span class="rpWho"></span>: <span class="rpSnippet"></span></div>
        <button id="rpCancel" type="button">✕</button>
      </div>
      <div id="composer">
        <button id="emojiBtn" type="button">🙂</button>
        <button id="photoBtn" type="button" title="파일 첨부">📎</button>
        <input type="file" id="imgInput" style="display:none;">
        <div id="emojiPanel"></div>
        <textarea id="msgInput" rows="1" placeholder="메시지를 입력하세요..."></textarea>
        <button id="sendBtn">보내기</button>
      </div>
    </div>

    <div id="calPane">
      <div class="calHead">
        <h2 id="calMonthLabel"></h2>
        <div class="calNav">
          <button id="calPrev">‹</button>
          <button id="calNext">›</button>
        </div>
      </div>
      <div id="calGrid"></div>

      <div id="evtSection">
        <h3 id="evtDateLabel">일정</h3>
        <div id="evtList"></div>
        <div id="evtForm">
          <input id="evtTitle" type="text" placeholder="일정 제목">
          <button id="evtAddBtn">이 날짜에 일정 추가</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="note">
    ⚠ 이 방은 사내 보안 정책상 암호화되지 않은 간이 도구입니다. 비밀번호는 각자 설정한 값의 해시만 저장되지만, 대화·일정 내용 자체는 암호화되지 않으니 기밀 정보는 입력하지 마세요. 메시지·사진은 30일이 지나거나 개수가 많아지면 자동으로 정리됩니다.
  </footer>
</div>

<div id="imgViewer"><img id="imgViewerImg" src=""></div>

<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:22px;width:280px;max-width:85vw;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.25);">
    <div id="confirmMsg" style="font-size:13.5px;margin-bottom:18px;color:#23282D;"></div>
    <div style="display:flex;gap:8px;">
      <button id="confirmCancel" style="flex:1;padding:9px;border-radius:8px;border:1px solid #DDE3E1;background:#fff;cursor:pointer;font-family:inherit;">취소</button>
      <button id="confirmOk" style="flex:1;padding:9px;border-radius:8px;border:none;background:#C0564B;color:#fff;cursor:pointer;font-family:inherit;">삭제</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   설정 — 다영님이 직접 수정하는 부분
   ============================================================ */

// 귀여운 캐릭터 아이콘 (SVG) — 초록오리 / 검정토끼
const DUCK_ICON = '<svg viewBox="0 0 36 36" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'
  + '<circle cx="18" cy="17" r="16" fill="#5CB37E"/>'
  + '<ellipse cx="18" cy="23.5" rx="8.5" ry="4.2" fill="#F4B942"/>'
  + '<ellipse cx="18" cy="23.5" rx="8.5" ry="4.2" fill="#F4B942"/>'
  + '<path d="M9.5 23.5 Q18 20.8 26.5 23.5" stroke="#DE9A26" stroke-width="1" fill="none"/>'
  + '<circle cx="12.5" cy="14.5" r="2.3" fill="#22301F"/>'
  + '<circle cx="23.5" cy="14.5" r="2.3" fill="#22301F"/>'
  + '<circle cx="11.9" cy="13.7" r="0.7" fill="#fff"/>'
  + '<circle cx="22.9" cy="13.7" r="0.7" fill="#fff"/>'
  + '<circle cx="7" cy="20" r="2.4" fill="#FFB3A7" opacity="0.55"/>'
  + '<circle cx="29" cy="20" r="2.4" fill="#FFB3A7" opacity="0.55"/>'
  + '<path d="M18 1 Q15.5 4 18 6.5 Q20.5 4 18 1Z" fill="#3D7F58"/>'
  + '</svg>';

const RABBIT_ICON = '<svg viewBox="0 0 36 36" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'
  + '<ellipse cx="11.5" cy="8.5" rx="4" ry="9.5" fill="#2B2E33" transform="rotate(-14 11.5 8.5)"/>'
  + '<ellipse cx="24.5" cy="8.5" rx="4" ry="9.5" fill="#2B2E33" transform="rotate(14 24.5 8.5)"/>'
  + '<ellipse cx="11.7" cy="9.2" rx="1.7" ry="5.8" fill="#F2A6C1" transform="rotate(-14 11.7 9.2)"/>'
  + '<ellipse cx="24.3" cy="9.2" rx="1.7" ry="5.8" fill="#F2A6C1" transform="rotate(14 24.3 9.2)"/>'
  + '<circle cx="18" cy="21" r="14.2" fill="#3A3E45"/>'
  + '<circle cx="12.7" cy="19.5" r="2.2" fill="#fff"/>'
  + '<circle cx="23.3" cy="19.5" r="2.2" fill="#fff"/>'
  + '<circle cx="12.7" cy="20.1" r="1.1" fill="#111"/>'
  + '<circle cx="23.3" cy="20.1" r="1.1" fill="#111"/>'
  + '<circle cx="18" cy="23.3" r="1.15" fill="#F2A6C1"/>'
  + '<path d="M15.8 25.2 Q18 27.3 20.2 25.2" stroke="#F2A6C1" stroke-width="1.3" fill="none" stroke-linecap="round"/>'
  + '<circle cx="7.5" cy="22.5" r="2" fill="#F2A6C1" opacity="0.4"/>'
  + '<circle cx="28.5" cy="22.5" r="2" fill="#F2A6C1" opacity="0.4"/>'
  + '</svg>';

const CONFIG = {
  ROOM_NAME: "TORI WORLD",
  CHARACTERS: [
    { name: "초록오리", icon: DUCK_ICON, color: "#4C9A6A" },
    { name: "검정토끼", icon: RABBIT_ICON, color: "#2B2E33" }
  ],
  POLL_MS: 4000,
  ONLINE_THRESHOLD_MS: 12000,  // 이 시간(ms) 동안 신호가 없으면 오프라인으로 간주
  MAX_FILE_BYTES: 4 * 1024 * 1024,  // 사진 외 일반 파일 최대 크기 (4MB)
  RETENTION_DAYS: 30,   // 이 기간(일)보다 오래된 메시지/사진은 자동 삭제
  MAX_MESSAGES: 400,    // 메시지 개수가 이보다 많아지면 오래된 것부터 자동 삭제

function esc(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function linkifyText(text){
  const urlRegex = /(https?:\/\/[^\s<]+[^\s<.,:;!?'")\]])/g;
  let parts = [];
  let lastIndex = 0;
  let match;
  while((match = urlRegex.exec(text)) !== null){
    parts.push(esc(text.slice(lastIndex, match.index)));
    const safeUrl = esc(match[0]);
    parts.push('<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + safeUrl + '</a>');
    lastIndex = match.index + match[0].length;
  }
  parts.push(esc(text.slice(lastIndex)));
  return parts.join('');
}

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));

}

async function pruneOldData(){
  const cutoff = Date.now() - CONFIG.RETENTION_DAYS * 24 * 60 * 60 * 1000;
  let toDelete = messages.filter(m => m.ts < cutoff);

  if(messages.length > CONFIG.MAX_MESSAGES){
    const excess = messages.length - CONFIG.MAX_MESSAGES;
    const oldestExcess = messages.slice(0, excess);
    oldestExcess.forEach(m => { if(!toDelete.includes(m)) toDelete.push(m); });
  }
  if(toDelete.length === 0) return;

  const deleteIds = toDelete.map(m => m.id);
  try{ await sb.from("messages").delete().in("id", deleteIds); }
  catch(e){ console.error("자동 정리(메시지) 실패", e); }

  for(const m of toDelete){
    if((m.type === "image" || m.type === "file") && m.imgKey){
      try{ await sb.from("images").delete().eq("key", m.imgKey); }
      catch(e){ /* 무시 */ }
      delete imageCache[m.imgKey];
      delete fileCache[m.imgKey];
    }
  }
  const deleteSet = new Set(deleteIds);
  messages = messages.filter(m => !deleteSet.has(m.id));
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("이미지를 열지 못했습니다."));
      img.onload = () => {
        const maxSide = 1000;
        let w = img.width, h = img.height;
        if(w > maxSide || h > maxSide){
          if(w >= h){ h = Math.round(h * maxSide / w); w = maxSide; }
          else{ w = Math.round(w * maxSide / h); h = maxSide; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let quality = 0.75;
        let out = canvas.toDataURL("image/jpeg", quality);
        // 4MB 넘으면 품질을 낮춰 다시 시도 (저장소 5MB 제한 대비 여유 확보)
        while(out.length > 4 * 1024 * 1024 && quality > 0.3){
          quality -= 0.15;
          out = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  });
  if(error){ console.error("메시지 저장 실패", error); return; }
  messages.push(msg);
  clearReplyTarget();
  renderMessages();
  markRead();
}

async function downloadAttachedFile(fileKey, name){
  let dataUrl = fileCache[fileKey];
  if(!dataUrl){
    try{
      const { data, error } = await sb.from("images").select("data").eq("key", fileKey).single();
      if(error) throw error;
      dataUrl = data.data;
      fileCache[fileKey] = dataUrl;
    }catch(err){
      showToast("파일을 불러오지 못했어요.");
      return;
    }
  }
  const a = document.createElement("a");
  a.href = dataUrl;
  a.download = name || "file";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.getElementById("imgViewer").addEventListener("click", () => {
  document.getElementById("imgViewer").style.display = "none";
});

async function sendMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;
  const rt = replyTarget;
  const msg = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    sender: currentUser, type: "text", text: text, ts: Date.now(),
    replyToId: rt ? rt.id : null, replyToSender: rt ? rt.sender : null, replyToSnippet: rt ? snippetOf(rt) : null
  };
  const { error } = await sb.from("messages").insert({
    id: msg.id, sender: msg.sender, type: "text", text: msg.text, ts: msg.ts,
    reply_to_id: msg.replyToId, reply_to_sender: msg.replyToSender, reply_to_snippet: msg.replyToSnippet
  });
  if(error){ console.error("메시지 저장 실패", error); return; }
  messages.push(msg);
  input.value = "";
  input.style.height = "auto";
  clearReplyTarget();
  renderMessages();
  markRead();
}

async function deleteMessage(id){
  const idx = messages.findIndex(m => m.id === id);
  if(idx < 0) return;
  const ok = await customConfirm("이 메시지를 삭제할까요?");
  if(!ok) return;
  const m = messages[idx];
  try{ await sb.from("messages").delete().eq("id", id); }
  catch(e){ console.error("메시지 삭제 실패", e); return; }
  messages.splice(idx, 1);
  if((m.type === "image" || m.type === "file") && m.imgKey){
    try{ await sb.from("images").delete().eq("key", m.imgKey); }
    catch(e){ /* 무시 */ }
    delete imageCache[m.imgKey];
    delete fileCache[m.imgKey];
  }
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById("messages");
  const distanceFromBottom = box.scrollHeight - box.scrollTop - box.clientHeight;
  box.innerHTML = "";
  let lastSender = null;
  messages.forEach(m => {
    if(m.type === "system"){
      const sys = document.createElement("div");
      sys.className = "sysMsg";
      sys.textContent = m.text;
      box.appendChild(sys);
      lastSender = null;
      return;
    }
    if(m.sender !== lastSender){
      const c = charInfo(m.sender);
      const tag = document.createElement("div");
      tag.className = "senderTag";
      tag.style.alignSelf = m.sender === currentUser ? "flex-end" : "flex-start";
      tag.innerHTML = iconHtml(c, 15) + "<span>" + esc(m.sender) + "</span>";
      box.appendChild(tag);
      lastSender = m.sender;
    }
    const row = document.createElement("div");
    row.className = "msgRow " + (m.sender === currentUser ? "me" : "other");
    row.dataset.ts = m.ts;
    row.dataset.mine = m.sender === currentUser ? "1" : "0";

    if(m.replyToSnippet){
      const quote = document.createElement("div");
      quote.className = "quoteBlock";
      quote.innerHTML = "<b>" + esc(m.replyToSender || "") + "</b>: " + esc(m.replyToSnippet);
      row.appendChild(quote);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if(m.type === "image"){
      const cached = imageCache[m.imgKey];
      if(cached){
        const imgEl = document.createElement("img");
        imgEl.src = cached;
        imgEl.onclick = () => {
          document.getElementById("imgViewerImg").src = cached;
          document.getElementById("imgViewer").style.display = "flex";
        };
        bubble.appendChild(imgEl);
      } else if(cached === null){
        bubble.classList.add("imgLoading");
        bubble.textContent = "사진을 불러오지 못했어요";
      } else {
        bubble.classList.add("imgLoading");
        bubble.textContent = "사진 불러오는 중...";
        fetchImageAndRerender(m.imgKey);
      }
    } else if(m.type === "file"){
      bubble.classList.add("fileCard");
      const icon = document.createElement("span");
      icon.className = "fileIcon";
      icon.textContent = "📄";
      const info = document.createElement("div");
      info.className = "fileInfo";
      const nameEl = document.createElement("div");
      nameEl.className = "fileName";
      nameEl.textContent = m.fileName || "파일";
      const sizeEl = document.createElement("div");
      sizeEl.className = "fileSize";
      sizeEl.textContent = m.fileSize ? formatFileSize(m.fileSize) + " · 눌러서 다운로드" : "눌러서 다운로드";
      info.appendChild(nameEl);
      info.appendChild(sizeEl);
      bubble.appendChild(icon);
      bubble.appendChild(info);
      bubble.onclick = () => downloadAttachedFile(m.imgKey, m.fileName);
    } else {
      bubble.innerHTML = linkifyText(m.text);
    }
    row.appendChild(bubble);

    const meta = document.createElement("div");
    meta.className = "metaRow";
    const time = new Date(m.ts);
    let metaHtml = time.getHours().toString().padStart(2,"0") + ":" + time.getMinutes().toString().padStart(2,"0");
    const replyBtn = document.createElement("span");
    replyBtn.className = "actionBtn";
    replyBtn.textContent = "답장";
    replyBtn.onclick = () => setReplyTarget(m);
    if(m.sender === currentUser){
      const readTag = document.createElement("span");
      readTag.className = "readTag";
      meta.textContent = metaHtml;
      meta.appendChild(readTag);
      meta.appendChild(replyBtn);
      const delBtn = document.createElement("span");
      delBtn.className = "actionBtn";
      delBtn.textContent = "삭제";
      delBtn.onclick = () => deleteMessage(m.id);
      meta.appendChild(delBtn);
    } else {
      meta.textContent = metaHtml;
      meta.appendChild(replyBtn);
    }
    row.appendChild(meta);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight - box.clientHeight - distanceFromBottom;
  updateReadTags();
}

function updateReadTags(){
  const otherReadTs = reads[otherUser()] || 0;
  document.querySelectorAll('.msgRow[data-mine="1"]').forEach(row => {
    const ts = Number(row.dataset.ts);
    const tag = row.querySelector(".readTag");
    if(tag) tag.textContent = ts <= otherReadTs ? " 읽음" : " 전송됨";
  });
}

async function markRead(){
  const latestOtherMsgTs = messages
    .filter(m => m.sender !== currentUser)
    .reduce((max, m) => Math.max(max, m.ts), 0);
  if(latestOtherMsgTs > (reads[currentUser] || 0)){
    const now = Date.now();
    reads[currentUser] = now;
    try{ await sb.from("reads").upsert({ user_name: currentUser, ts: now }); }
    catch(e){ console.error("읽음 정보 저장 실패", e); }
  }
  updateReadTags();
}

/* ---------------- 캘린더 ---------------- */
document.getElementById("calPrev").addEventListener("click", () => { calViewDate.setMonth(calViewDate.getMonth()-1); renderCalendar(); });
document.getElementById("calNext").addEventListener("click", () => { calViewDate.setMonth(calViewDate.getMonth()+1); renderCalendar(); });
document.getElementById("evtAddBtn").addEventListener("click", addEvent);
document.getElementById("evtTitle").addEventListener("keydown", e => { if(e.key === "Enter") addEvent(); });

function renderCalendar(){
  const year = calViewDate.getFullYear();
  const month = calViewDate.getMonth();
  document.getElementById("calMonthLabel").textContent = year + "년 " + (month+1) + "월";

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  ["일","월","화","수","목","금","토"].forEach(d => {
    const el = document.createElement("div");
    el.className = "calDow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();

  for(let i=0;i<firstDay;i++){
    const el = document.createElement("div");
    el.className = "calCell empty";
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cell = document.createElement("div");
    cell.className = "calCell";
    if(dateStr === today) cell.classList.add("today");
    if(dateStr === selectedDate) cell.classList.add("selected");
    cell.innerHTML = d;
    if(events.some(ev => ev.date === dateStr)){
      const dot = document.createElement("div");
      dot.className = "evtDot";
      cell.appendChild(dot);
    }
    cell.onclick = () => { selectedDate = dateStr; renderCalendar(); renderEvents(); };
    grid.appendChild(cell);
  }
  renderEvents();
}

function renderEvents(){
  document.getElementById("evtDateLabel").textContent = selectedDate + " 일정";
  const list = document.getElementById("evtList");
  list.innerHTML = "";
  const dayEvents = events.filter(ev => ev.date === selectedDate).sort((a,b)=>a.ts-b.ts);
  if(dayEvents.length === 0){
    const empty = document.createElement("div");
    empty.className = "evtEmpty";
    empty.textContent = "등록된 일정이 없습니다.";
    list.appendChild(empty);
  } else {
    dayEvents.forEach(ev => {
      const c = charInfo(ev.creator);
      const item = document.createElement("div");
      item.className = "evtItem";
      item.innerHTML = '<div class="txt">' + esc(ev.title) + '<div class="who">' + iconHtml(c,13) + ' ' + esc(ev.creator) + '</div></div>';
      const delBtn = document.createElement("button");
      delBtn.textContent = "삭제";
      delBtn.onclick = () => deleteEvent(ev.id);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }
}

async function addEvent(){
  const titleInput = document.getElementById("evtTitle");
  const title = titleInput.value.trim();
  if(!title) return;
  const ev = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    date: selectedDate, title: title, creator: currentUser, ts: Date.now()
  };
  const { error } = await sb.from("events").insert(ev);
  if(error){ console.error("일정 저장 실패", error); return; }
  events.push(ev);
  titleInput.value = "";
  renderCalendar();
}

async function deleteEvent(id){
  try{ await sb.from("events").delete().eq("id", id); }
  catch(e){ console.error("일정 삭제 실패", e); return; }
  events = events.filter(ev => ev.id !== id);
  renderCalendar();
}

  await loadAuthMap();
  renderCharScreen();
})();
